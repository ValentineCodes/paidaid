[package]
name = "paidaid-escrow"
description = "PaidAid engagement escrow (native + NEP-141)"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
borsh = { version = "1.8.1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
